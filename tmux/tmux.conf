# Renumber windows on deletion
set -g renumber-windows on

# Start windows and panes indexes at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable Vim mode
setw -g mode-keys vi

# Clear screen when a process is running
bind C-l send-keys -R

# Set the history limit to 10000
set -g history-limit 10000

# Set Ctrl+Space as the Prefix
set -g prefix C-Space

# Easily move windows around
bind -r P swap-window -d -t -1
bind -r N swap-window -d -t +1

# TMUX Fingers plugin
set -g @plugin 'Morantron/tmux-fingers'

# TMUX Srcery theme
set -g @plugin 'srcery-colors/srcery-tmux'

# Highlight Prefix
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize TMUX Plugin Manager
run '~/.tmux/plugins/tpm/tpm'
